  // 세트별 부위 아이템명 (gear_set_pieces) — "set-<en 정규화>" id로 묶는다 (FARM_CATS 세트 id와 동일한 규칙)
  const SLOT_LABELS = { mask: "마스크", chest: "방탄복", backpack: "백팩", gloves: "장갑", holster: "권총집", kneepads: "무릎보호대" };

  // 무기/방어구 속성 카탈로그 — 전부 DB(gear_core_attrs/gear_secondary_attrs/
  // weapon_core_attrs/weapon_secondary_attrs/gear_mods)에서 불러온다.
  // 무기와 방어구는 나무위키상 속성 체계 자체가 다르다:
  //   방어구: 핵심속성 3종 중 1개 택1 + 카테고리별 비핵심속성(무기/방어도/스킬) + (마스크·방탄복·백팩만) 개조
  //   무기: 무기군마다 정해진 핵심속성 1~2개(전 무기군 공용 "무기 대미지" + 무기군별 고유 스탯) + 공용 비핵심속성 13종
  let gearCoreAttrs = [];       // [{label, color}]
  let gearSecondaryGroups = []; // [{label, color, items:[name,...]}]
  let weaponCoreAttrs = {};     // { weapon_group: [name,...] }
  let weaponSecondaryAttrs = []; // [name,...]
  let gearModOptions = [];      // [name,...] — 개조 입력칸 자동완성용

  async function loadAttrCatalogs() {
    const [gc, gs, wc, ws, gm] = await Promise.all([
      supabase.from("gear_core_attrs").select("name_ko, color").order("id"),
      supabase.from("gear_secondary_attrs").select("category_ko, color, name_ko").order("id"),
      supabase.from("weapon_core_attrs").select("weapon_group, name_ko").order("id"),
      supabase.from("weapon_secondary_attrs").select("name_ko").order("id"),
      supabase.from("gear_mods").select("name_ko").order("id")
    ]);
    if (gc.error) console.error(gc.error); else gearCoreAttrs = gc.data.map((r) => ({ label: r.name_ko, color: r.color }));
    if (gs.error) console.error(gs.error);
    else {
      gearSecondaryGroups = [];
      gs.data.forEach((r) => {
        let g = gearSecondaryGroups.find((x) => x.label === r.category_ko);
        if (!g) { g = { label: r.category_ko, color: r.color, items: [] }; gearSecondaryGroups.push(g); }
        g.items.push(r.name_ko);
      });
    }
    if (wc.error) console.error(wc.error);
    else {
      weaponCoreAttrs = {};
      wc.data.forEach((r) => { (weaponCoreAttrs[r.weapon_group] || (weaponCoreAttrs[r.weapon_group] = [])).push(r.name_ko); });
    }
    if (ws.error) console.error(ws.error); else weaponSecondaryAttrs = ws.data.map((r) => r.name_ko);
    if (gm.error) console.error(gm.error); else gearModOptions = gm.data.map((r) => r.name_ko);
  }

  let setPieces = {};

  // 빌드 슬롯 정의 — weapon 타입은 부위 선택부터(gear는 부위가 고정이라 바로 브랜드 픽커로)
  const BUILD_SLOTS = [
    { key: "weapon1", label: "무기1", type: "weapon" },
    { key: "weapon2", label: "무기2", type: "weapon" },
    { key: "weapon3", label: "무기3", type: "weapon" },
    { key: "mask", label: "마스크", type: "gear", cat: "mask" },
    { key: "backpack", label: "백팩", type: "gear", cat: "pack" },
    { key: "chest", label: "방탄복", type: "gear", cat: "chest" },
    { key: "gloves", label: "장갑", type: "gear", cat: "gloves" },
    { key: "holster", label: "권총집", type: "gear", cat: "holster" },
    { key: "kneepads", label: "무릎보호대", type: "gear", cat: "knee" }
  ];
  // 빌드 슬롯 화면 배치: 무기 3개 한 줄, 방어구는 부위 2개씩 한 줄
  const BUILD_SLOT_ROWS = [
    ["weapon1", "weapon2", "weapon3"],
    ["mask", "backpack"],
    ["chest", "gloves"],
    ["holster", "kneepads"]
  ];
  let builds = [];
  let buildNameByItemId = {}; // farm_custom_items.id -> 그 아이템이 포함된 빌드명 (표시용, "적용 빌드" 태그)

  // 스킬 카탈로그 (skills 테이블) — 카테고리 한국어명별로 세부 종류 목록을 묶어 둔다
  let skillOptions = {};

  async function loadSkills() {
    const { data, error } = await supabase.from("skills").select("category_ko, name_ko").order("id");
    if (error) { console.error(error); return; }
    skillOptions = {};
    data.forEach((s) => {
      (skillOptions[s.category_ko] || (skillOptions[s.category_ko] = [])).push(s.name_ko);
    });
  }

  async function loadBuilds() {
    const { data, error } = await supabase.from("farm_builds").select("*");
    if (error) { console.error(error); return; }
    buildNameByItemId = {};
    builds = data.map((b) => {
      const isOwn = !!session && b.user_id === session.user.id;
      BUILD_SLOTS.forEach((s) => {
        const id = b[s.key + "_id"];
        if (id) buildNameByItemId[id] = b.name;
      });
      return Object.assign({ isOwn }, b);
    });
  }

  async function saveBuild(draft) {
    const payload = { name: draft.name, skill1: draft.skill1 || null, skill2: draft.skill2 || null, shared: !!draft.shared };
    BUILD_SLOTS.forEach((s) => { payload[s.key + "_id"] = draft.slots[s.key] ? draft.slots[s.key].itemId : null; });
    const { data, error } = draft.id
      ? await supabase.from("farm_builds").update(payload).eq("id", draft.id).select().single()
      : await supabase.from("farm_builds").insert(payload).select().single();
    if (error) { console.error(error); return null; }
    return data;
  }

  async function deleteBuild(id) {
    const { error } = await supabase.from("farm_builds").delete().eq("id", id);
    if (error) console.error(error);
  }

  async function loadSetPieces() {
    const { data, error } = await supabase.from("gear_set_pieces").select("gear_set_id, slot, name_ko");
    if (error) { console.error(error); return; }
    setPieces = {};
    data.forEach((p) => {
      const gs = GEAR_SETS.find((g) => g.id === p.gear_set_id);
      if (!gs) return;
      const catId = "set-" + nameKey(gs.en);
      (setPieces[catId] || (setPieces[catId] = [])).push(p);
    });
  }

  // "무엇을 만드시나요?" 첫 화면에서 바로 이름으로 검색할 수 있게 모든 아이템을 하나의 색인으로 합친다.
  let searchIndex = [];

  function buildSearchIndex() {
    searchIndex = [];
    const addAll = (grouped, group, kind) => {
      Object.entries(grouped).forEach(([cat, list]) => {
        list.forEach((m) => {
          searchIndex.push({
            name: m.name_ko,
            group, cat, kind: kind || null,
            effect: m.talent_name_ko ? `${m.talent_name_ko}: ${m.talent_desc_ko}` : null
          });
        });
      });
    };
    addAll(weaponModels, "무기", null);
    addAll(weaponNamed, "무기", "네임드");
    addAll(weaponExotic, "무기", "특급");
    addAll(gearNamed, "보호장구", "네임드");
    addAll(gearExotic, "보호장구", "특급");
    Object.entries(setPieces).forEach(([cat, list]) => {
      const gearSetForCat = GEAR_SETS.find((g) => "set-" + nameKey(g.en) === cat);
      list.forEach((p) => {
        const bonus = gearSetForCat && (p.slot === "chest" ? gearSetForCat.chest : p.slot === "backpack" ? gearSetForCat.pack : null);
        searchIndex.push({ name: p.name_ko, group: "세트", cat, kind: "세트", effect: bonus ? `${bonus.n}: ${bonus.t}` : null });
      });
    });
  }

  async function saveCustomItem({ category, kind, name, mainAttrs, subAttrs, effect, shared, gearMod }) {
    const { data, error } = await supabase.from("farm_custom_items").insert({
      category, kind, name,
      main_attrs: mainAttrs,
      sub_attrs: subAttrs,
      special_effect: effect || null,
      gear_mod: gearMod || null,
      shared: !!shared
    }).select().single();
    if (error) { console.error(error); return null; }
    return data;
  }

  async function updateCustomItem(id, { kind, name, mainAttrs, subAttrs, effect, shared, gearMod }) {
    const { error } = await supabase.from("farm_custom_items").update({
      kind, name,
      main_attrs: mainAttrs,
      sub_attrs: subAttrs,
      special_effect: effect || null,
      gear_mod: gearMod || null,
      shared: !!shared
    }).eq("id", id);
    if (error) { console.error(error); return false; }
    return true;
  }

  async function deleteCustomItem(id) {
    const { error } = await supabase.from("farm_custom_items").delete().eq("id", id);
    if (error) console.error(error);
  }

  function renderBuildItems(list, buildsToShow) {
    buildsToShow.forEach((b) => {
      const li = el("li", "fitem");
      const body = el("div", "fbody");
      const name = el("div", "fname");
      name.appendChild(el("b", "", b.name));
      name.appendChild(el("span", "ftag k-set", "빌드"));
      if (b.shared) name.appendChild(el("span", "ftag ftag-shared", b.isOwn ? "공유중" : "공유받음"));
      body.appendChild(name);
      BUILD_SLOTS.forEach((s) => {
        const itemId = b[s.key + "_id"];
        if (!itemId) return;
        const item = customRawById[itemId];
        const p = el("p", "ffx");
        p.appendChild(document.createTextNode(s.label + ": "));
        p.appendChild(el("b", "", item ? item.name : "(삭제된 항목)"));
        body.appendChild(p);
      });
      if (b.skill1) body.appendChild(el("p", "ffx", "스킬1: " + b.skill1));
      if (b.skill2) body.appendChild(el("p", "ffx", "스킬2: " + b.skill2));
      if (b.isOwn) {
        const actions = el("div", "fitem-actions");
        const editBtn = el("button", "flink", "수정");
        editBtn.type = "button";
        editBtn.addEventListener("click", (e) => { e.preventDefault(); openEditForBuild(b); });
        const delBtn = el("button", "flink flink-danger", "삭제");
        delBtn.type = "button";
        delBtn.addEventListener("click", async (e) => {
          e.preventDefault();
          if (!confirm(`"${b.name}" 빌드를 삭제할까요?`)) return;
          await deleteBuild(b.id);
          await loadBuilds();
          renderFarmList();
        });
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        body.appendChild(actions);
      }
      li.appendChild(body);
      list.appendChild(li);
    });
    if (!buildsToShow.length) list.appendChild(el("li", "empty", "등록된 빌드가 없습니다."));
  }

  function renderFarmList() {
    const list = $("farm-list");
    list.replaceChildren();
    if (farmFilter === "빌드") {
      renderBuildItems(list, builds.filter((b) => b.isOwn));
      return;
    }
    if (typeof farmCat === "string" && farmCat.indexOf("build-") === 0 && !farmFilter) {
      const buildId = Number(farmCat.slice("build-".length));
      renderBuildItems(list, builds.filter((b) => b.id === buildId));
      return;
    }
    let items;
    if (farmFilter) {
      items = [];
      Object.keys(customItems).forEach((catId) => {
        const cat = FARM_CATS.find((c) => c.id === catId);
        if (!cat) return;
        if (farmFilter !== "전체" && cat.group !== farmFilter) return;
        customItems[catId].filter((it) => it.isOwn).forEach((it) => items.push(Object.assign({ _cat: catId, _catLabel: cat.label }, it)));
      });
    } else {
      items = (FARM_ITEMS[farmCat] || []).concat(customItems[farmCat] || []);
    }
    items.forEach((it) => {
      const cat = farmFilter ? it._cat : farmCat;
      const key = cat + "|" + it.id;
      const li = el("li", "fitem" + (farmDone[key] ? " done" : ""));
      if (it.kind) li.dataset.kind = it.kind;
      const label = el("label", "frow");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!farmDone[key];
      cb.addEventListener("change", () => {
        if (cb.checked) farmDone[key] = true; else delete farmDone[key];
        li.classList.toggle("done", cb.checked);
        toggleFarmDone(key, cb.checked);
      });
      label.appendChild(cb);
      const body = el("div", "fbody");
      const name = el("div", "fname");
      name.appendChild(el("b", "", it.ko));
      if (it.en) name.appendChild(el("span", "fen", it.en));
      if (it._catLabel) name.appendChild(el("span", "ftag", it._catLabel));
      if (it.kind) name.appendChild(el("span", "ftag " + (it.kind === "특급" ? "k-ex" : it.kind === "네임드" ? "k-nm" : it.kind === "세트" ? "k-set" : ""), it.kind));
      if (it.brand) name.appendChild(el("span", "ftag", it.brand));
      if (it.custom && it.shared) name.appendChild(el("span", "ftag ftag-shared", it.isOwn ? "공유중" : "공유받음"));
      if (it.custom && buildNameByItemId[it.dbId]) name.appendChild(el("span", "ftag", "적용 빌드: " + buildNameByItemId[it.dbId]));
      body.appendChild(name);
      (it.rows || []).forEach(([k, v]) => {
        const p = el("p", "ffx");
        p.appendChild(document.createTextNode(k + ": "));
        p.appendChild(el("b", "", v));
        body.appendChild(p);
      });
      if (it.fx) body.appendChild(el("p", "fget", it.fx));
      if (it.mod) body.appendChild(el("p", "ffx", `개조: ${it.mod}`));
      if (it.custom && it.isOwn) {
        const actions = el("div", "fitem-actions");
        const editBtn = el("button", "flink", "수정");
        editBtn.type = "button";
        editBtn.addEventListener("click", (e) => {
          e.preventDefault();
          openEditForCustomItem(customRawById[it.dbId]);
        });
        const delBtn = el("button", "flink flink-danger", "삭제");
        delBtn.type = "button";
        delBtn.addEventListener("click", async (e) => {
          e.preventDefault();
          if (!confirm(`"${it.ko}" 항목을 삭제할까요?`)) return;
          await deleteCustomItem(it.dbId);
          await loadCustomItems();
          renderFarmList();
        });
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        body.appendChild(actions);
      }
      label.appendChild(body);
      li.appendChild(label);
      list.appendChild(li);
    });
    if (!items.length) list.appendChild(el("li", "empty", farmFilter ? "등록한 항목이 없습니다." : "아직 등록된 아이템이 없습니다."));
  }

  function renderFarmChips() {
    const box = $("farm-chips");
    box.replaceChildren();

    const filterWrap = el("div", "fgroup");
    filterWrap.appendChild(el("span", "fgroup-label", "내 목록"));
    const filterRow = el("div", "fchips");
    ["전체", "무기", "보호장구", "세트", "빌드"].forEach((f) => {
      const b = el("button", "fchip", f);
      b.type = "button";
      b.setAttribute("aria-pressed", String(farmFilter === f));
      b.addEventListener("click", () => { farmFilter = f; renderFarmChips(); });
      filterRow.appendChild(b);
    });
    filterWrap.appendChild(filterRow);
    box.appendChild(filterWrap);

    ["무기", "보호장구", "세트"].forEach((g) => {
      const wrap = el("div", "fgroup");
      wrap.appendChild(el("span", "fgroup-label", g));
      const row = el("div", "fchips");
      FARM_CATS.filter((c) => c.group === g).forEach((c) => {
        const b = el("button", "fchip", c.label);
        b.type = "button";
        b.setAttribute("aria-pressed", String(!farmFilter && c.id === farmCat));
        b.addEventListener("click", () => { farmCat = c.id; farmFilter = null; renderFarmChips(); });
        row.appendChild(b);
      });
      wrap.appendChild(row);
      box.appendChild(wrap);
    });

    // 빌드는 세트처럼 각 빌드명을 칩으로 보여준다
    if (builds.length) {
      const buildWrap = el("div", "fgroup");
      buildWrap.appendChild(el("span", "fgroup-label", "빌드"));
      const buildRow = el("div", "fchips");
      builds.forEach((b) => {
        const chipCat = "build-" + b.id;
        const btn = el("button", "fchip", b.name);
        btn.type = "button";
        btn.setAttribute("aria-pressed", String(!farmFilter && farmCat === chipCat));
        btn.addEventListener("click", () => { farmCat = chipCat; farmFilter = null; renderFarmChips(); });
        buildRow.appendChild(btn);
      });
      buildWrap.appendChild(buildRow);
      box.appendChild(buildWrap);
    }

    renderFarmList();
  }

  // ---------- 파밍 항목 생성 폼 ----------
  let createOpen = false;
  let createGroup = null;      // "무기" | "보호장구"
  let createCat = null;        // FARM_CATS id
  let createModelName = undefined; // 무기 실제 모델명: undefined=아직 선택 전, null=직접 입력 선택, string=선택된 모델명
  let createModelKind = null;      // 픽커에서 고른 항목의 고정 등급 (네임드/특급), null이면 기본값(일반) 사용
  let createModelEffect = null;    // 픽커에서 고른 항목의 고정 특수효과 텍스트 (네임드/특급 무기는 효과가 정해져 있음)
  let createFixedAttrs = [];       // 네임드 방어구의 고유 속성(고정, 수정 불가) — 보조속성 칸에 잠긴 채로 채워짐
  let createPieceSlot = null;      // 세트 부위 선택 시의 실제 슬롯(mask/chest/backpack/gloves/holster/kneepads) — 개조 가능 여부 판단용
  let editingId = null;        // farm_custom_items.id when editing, null when creating
  let buildDraft = null;       // 빌드 작성 중 임시 상태: { id, name, skill1, skill2, shared, slots:{key:{itemId,name}} }
  let buildReturnSlot = null;  // 빌드의 특정 슬롯을 채우러 일반 항목생성 플로우에 들어온 경우 그 슬롯 key
  let buildSkillSlot = null;   // "skill1"|"skill2" — 스킬 피커가 열려있는 경우 그 슬롯 key
  let skillPickCategory = null; // 스킬 피커 1단계(카테고리)에서 고른 카테고리, null이면 카테고리 선택 화면

  const formatAttr = (a) => `${a.num >= 0 ? "+" : ""}${a.num}${a.unit || ""} ${a.type}`;

  function pickModel(name, kind, effect, fixedAttrs) {
    createModelName = name;
    createModelKind = kind || null;
    createModelEffect = effect || null;
    createFixedAttrs = (fixedAttrs || []).map(formatAttr);
    renderCreatePanel();
  }

  // 검색은 띄어쓰기 차이를 무시한다 ("성엘모"로 쳐도 "성 엘모의 엔진"을 찾도록)
  const normSearch = (s) => String(s).toLowerCase().replace(/\s+/g, "");

  function labeledField(label, inputEl) {
    const row = el("div", "fcreate-row");
    row.appendChild(el("label", "fcreate-label", label));
    row.appendChild(inputEl);
    return row;
  }

  function breadcrumb() {
    const catLabel = (FARM_CATS.find((c) => c.id === createCat) || {}).label || createCat;
    const parts = [createGroup, catLabel];
    if (createModelName) parts.push(createModelName);
    const filtered = parts.filter(Boolean);
    const wrap = el("span", "fcreate-breadcrumb");
    filtered.forEach((p, i) => {
      if (i > 0) wrap.appendChild(el("span", "fcreate-breadcrumb-sep", "›"));
      wrap.appendChild(el(i === filtered.length - 1 ? "b" : "span", "", p));
    });
    return wrap;
  }

  function pickerHeader(onBack) {
    const bar = el("div", "fcreate-headerbar");
    const back = el("button", "fcreate-backbtn", "‹");
    back.type = "button";
    back.setAttribute("aria-label", "뒤로");
    back.addEventListener("click", onBack);
    bar.appendChild(back);
    bar.appendChild(breadcrumb());
    return bar;
  }

  function closeCreatePanel() {
    createOpen = false;
    createGroup = null;
    createCat = null;
    createModelName = undefined;
    createModelKind = null;
    createModelEffect = null; createFixedAttrs = []; createPieceSlot = null;
    editingId = null;
    buildDraft = null;
    buildReturnSlot = null;
    buildSkillSlot = null;
    skillPickCategory = null;
    renderCreatePanel();
  }

  function openEditForCustomItem(row) {
    const cat = FARM_CATS.find((c) => c.id === row.category);
    createGroup = cat ? cat.group : null;
    createCat = row.category;
    createModelName = undefined;
    createModelKind = null;
    createModelEffect = null; createFixedAttrs = []; createPieceSlot = null;
    if (createGroup === "세트") {
      const piece = (setPieces[row.category] || []).find((p) => p.name_ko === row.name);
      if (piece) createPieceSlot = piece.slot;
    }
    editingId = row.id;
    createOpen = true;
    renderCreatePanel();
  }

  function openEditForBuild(b) {
    buildDraft = { id: b.id, name: b.name, skill1: b.skill1 || "", skill2: b.skill2 || "", shared: !!b.shared, slots: {} };
    BUILD_SLOTS.forEach((s) => {
      const itemId = b[s.key + "_id"];
      if (itemId) buildDraft.slots[s.key] = { itemId, name: (customRawById[itemId] || {}).name || "?" };
    });
    createGroup = "빌드";
    createOpen = true;
    renderCreatePanel();
  }

  function renderCreatePanel() {
    const box = $("farm-create");
    box.hidden = !createOpen;
    box.replaceChildren();
    $("farm-create-btn").textContent = createOpen ? "취소" : "+ 항목 생성";
    $("farm-chips").hidden = createOpen;
    $("farm-list").hidden = createOpen;
    if (!createOpen) return;

    const toolbar = el("div", "farm-toolbar farm-toolbar-inline");
    const homeBtn = el("button", "ficon-btn", "⌂");
    homeBtn.type = "button";
    homeBtn.setAttribute("aria-label", "새 항목 만들기");
    homeBtn.title = "새 항목 만들기";
    homeBtn.addEventListener("click", () => {
      if (buildReturnSlot) {
        buildReturnSlot = null;
        createGroup = "빌드";
        createCat = null;
        createModelName = undefined; createModelKind = null; createModelEffect = null; createFixedAttrs = []; createPieceSlot = null;
        editingId = null;
        renderCreatePanel();
        return;
      }
      createGroup = null;
      createCat = null;
      createModelName = undefined;
      createModelKind = null;
      createModelEffect = null; createFixedAttrs = []; createPieceSlot = null;
      editingId = null;
      buildDraft = null;
      renderCreatePanel();
    });
    const listBtn = el("button", "ficon-btn", "☰");
    listBtn.type = "button";
    listBtn.setAttribute("aria-label", "체크리스트 보기");
    listBtn.title = "체크리스트 보기";
    listBtn.addEventListener("click", () => closeCreatePanel());
    toolbar.appendChild(homeBtn);
    toolbar.appendChild(listBtn);
    box.appendChild(toolbar);

    if (createGroup === "빌드") {
      if (buildSkillSlot) { renderSkillPicker(box); return; }
      renderBuildEditor(box);
      return;
    }

    if (!createGroup) {
      const center = el("div", "fcreate-center");
      center.appendChild(el("div", "fcreate-intro", "어떤 종류의 항목을 만드시나요?"));

      const search = document.createElement("input");
      search.type = "text";
      search.className = "fcreate-search";
      search.placeholder = "이름으로 바로 검색 (예: 성 엘모)";
      center.appendChild(search);

      const results = el("div", "fcard-grid fcard-grid-scroll");
      results.hidden = true;
      center.appendChild(results);

      const grid = el("div", "fcard-grid");
      ["무기", "보호장구", "세트", "빌드"].forEach((g) => {
        const b = el("button", "fcard", g);
        b.type = "button";
        b.addEventListener("click", () => { createGroup = g; renderCreatePanel(); });
        grid.appendChild(b);
      });
      center.appendChild(grid);
      box.appendChild(center);

      search.addEventListener("input", () => {
        const q = normSearch(search.value.trim());
        results.replaceChildren();
        if (!q) { results.hidden = true; grid.hidden = false; return; }
        grid.hidden = true;
        results.hidden = false;
        const matches = searchIndex.filter((e) => normSearch(e.name).includes(q)).slice(0, 30);
        if (!matches.length) {
          results.appendChild(el("span", "fcreate-empty", "검색 결과가 없습니다."));
          return;
        }
        matches.forEach((entry) => {
          const label = entry.kind ? `${entry.name} (${entry.kind})` : entry.name;
          const b = el("button", "fcard fcard-sm", label);
          b.type = "button";
          b.addEventListener("click", () => {
            createGroup = entry.group;
            createCat = entry.cat;
            pickModel(entry.name, entry.kind, entry.effect);
          });
          results.appendChild(b);
        });
      });
      return;
    }

    if (!createCat) {
      box.appendChild(pickerHeader(() => {
        if (buildReturnSlot) { buildReturnSlot = null; createGroup = "빌드"; editingId = null; renderCreatePanel(); return; }
        createGroup = null; editingId = null; renderCreatePanel();
      }));

      const center = el("div", "fcreate-center");
      center.appendChild(el("div", "fcreate-intro", `${createGroup} 중 어떤 부위인가요?`));

      const search = document.createElement("input");
      search.type = "text";
      search.className = "fcreate-search";
      search.placeholder = "검색...";
      center.appendChild(search);

      const grid = el("div", "fcard-grid fcard-grid-scroll");
      FARM_CATS.filter((c) => c.group === createGroup).forEach((c) => {
        const b = el("button", "fcard", c.label);
        b.type = "button";
        b.addEventListener("click", () => { createCat = c.id; renderCreatePanel(); });
        grid.appendChild(b);
      });
      center.appendChild(grid);
      box.appendChild(center);

      search.addEventListener("input", () => {
        const q = normSearch(search.value.trim());
        grid.querySelectorAll(".fcard").forEach((btn) => {
          btn.hidden = !!q && !normSearch(btn.textContent).includes(q);
        });
      });
      return;
    }

    // 무기는 실제 무기 모델명을, 방어구는 브랜드명을, 세트는 부위별 아이템명을 먼저 고르게 한다.
    if (createModelName === undefined && !editingId) {
      box.appendChild(pickerHeader(() => {
        const slotDef = buildReturnSlot && BUILD_SLOTS.find((s) => s.key === buildReturnSlot);
        if (slotDef && slotDef.type === "gear") { buildReturnSlot = null; createGroup = "빌드"; createCat = null; renderCreatePanel(); return; }
        createCat = null; renderCreatePanel();
      }));

      const catLabel = (FARM_CATS.find((c) => c.id === createCat) || {}).label || createCat;
      const isWeapon = createGroup === "무기";
      const isGear = createGroup === "보호장구";
      const intro = isWeapon ? "실제 무기 이름을 선택하세요" : isGear ? "브랜드를 선택하세요" : "세트 부위를 선택하세요";

      const center = el("div", "fcreate-center");
      center.appendChild(el("div", "fcreate-intro", intro));

      const search = document.createElement("input");
      search.type = "text";
      search.className = "fcreate-search";
      search.placeholder = "검색...";
      center.appendChild(search);

      if (isWeapon || isGear) center.appendChild(el("div", "fcreate-subhead fcreate-subhead-normal", "일반"));

      const gearSetForCat = (!isWeapon && !isGear) ? GEAR_SETS.find((g) => "set-" + nameKey(g.en) === createCat) : null;

      const grid = el("div", "fcard-grid fcard-grid-scroll");
      if (isWeapon) {
        (weaponModels[createCat] || []).forEach((m) => {
          const b = el("button", "fcard fcard-sm", m.name_ko);
          b.type = "button";
          b.addEventListener("click", () => pickModel(m.name_ko));
          grid.appendChild(b);
        });
      } else if (isGear) {
        BRAND_SETS.forEach((brand) => {
          const b = el("button", "fcard fcard-sm", brand.ko);
          b.type = "button";
          b.addEventListener("click", () => pickModel(`${brand.ko} ${catLabel}`));
          grid.appendChild(b);
        });
      } else {
        // 방탄복·백팩 부위는 세트 자체의 특수효과(4셋 특수효과)를 고정으로 물려받는다.
        (setPieces[createCat] || []).forEach((p) => {
          const label = `${SLOT_LABELS[p.slot] || p.slot}: ${p.name_ko}`;
          const b = el("button", "fcard fcard-sm", label);
          b.type = "button";
          const bonus = gearSetForCat && (p.slot === "chest" ? gearSetForCat.chest : p.slot === "backpack" ? gearSetForCat.pack : null);
          const effect = bonus ? `${bonus.n}: ${bonus.t}` : null;
          b.addEventListener("click", () => { createPieceSlot = p.slot; pickModel(p.name_ko, "세트", effect); });
          grid.appendChild(b);
        });
      }
      if (!grid.children.length) grid.appendChild(el("span", "fcreate-empty", "아직 등록된 항목이 없습니다."));
      center.appendChild(grid);

      // 세트는 하단에 2/3/4셋 효과를 참고용으로 보여준다.
      if (gearSetForCat) {
        const info = el("div", "fcreate-setinfo");
        const addTier = (label, texts) => {
          if (!texts || !texts.length) return;
          const row = el("div", "fcreate-setinfo-row");
          row.appendChild(el("div", "fcreate-setinfo-label", label));
          const body = el("div", "fcreate-setinfo-body");
          texts.forEach((t) => body.appendChild(el("p", "", t)));
          row.appendChild(body);
          info.appendChild(row);
        };
        addTier("2세트", gearSetForCat.s2);
        addTier("3세트", gearSetForCat.s3);
        addTier("4세트", (gearSetForCat.s4 || []).map((e) => `${e.n}: ${e.t}`));
        if (info.children.length) center.appendChild(info);
      }

      // 무기/방어구는 기본 모델·브랜드 밑에 "네임드"/"특급" 항목도 보여준다 — 등급·특수효과가 고정이라 같이 채워 넣는다.
      const addPickerSection = (list, label, extraClass) => {
        if (!list.length) return;
        center.appendChild(el("div", "fcreate-subhead" + (extraClass ? " " + extraClass : ""), label));
        const subGrid = el("div", "fcard-grid fcard-grid-scroll");
        list.forEach((m) => {
          const b = el("button", "fcard fcard-sm", m.name_ko);
          b.type = "button";
          const effect = m.talent_name_ko ? `${m.talent_name_ko}: ${m.talent_desc_ko}` : null;
          b.addEventListener("click", () => pickModel(m.name_ko, label, effect, m.attrs));
          subGrid.appendChild(b);
        });
        center.appendChild(subGrid);
      };
      if (isWeapon) {
        addPickerSection(weaponNamed[createCat] || [], "네임드");
        addPickerSection(weaponExotic[createCat] || [], "특급", "fcreate-subhead-exotic");
      } else if (isGear) {
        addPickerSection(gearNamed[createCat] || [], "네임드");
        addPickerSection(gearExotic[createCat] || [], "특급", "fcreate-subhead-exotic");
      }

      search.addEventListener("input", () => {
        const q = normSearch(search.value.trim());
        center.querySelectorAll(".fcard").forEach((btn) => {
          btn.hidden = !!q && !normSearch(btn.textContent).includes(q);
        });
      });

      const skip = el("button", "flink", "목록에 없어요 (직접 입력)");
      skip.type = "button";
      skip.addEventListener("click", () => pickModel(null));
      center.appendChild(skip);

      box.appendChild(center);
      return;
    }

    const editRow = editingId ? customRawById[editingId] : null;

    const form = el("form", "fcreate-form");

    form.appendChild(pickerHeader(() => {
      if (!editingId) { createModelName = undefined; createModelKind = null; createModelEffect = null; createFixedAttrs = []; createPieceSlot = null; }
      else { createCat = null; editingId = null; }
      renderCreatePanel();
    }));

    let kindVal = editRow ? editRow.kind : (createGroup === "세트" ? "세트" : (createModelKind || "일반"));
    const kindWrap = el("div", "fcreate-kinds");
    if (createGroup === "세트") {
      kindWrap.appendChild(el("span", "fkind fkind-set", "세트"));
    } else {
      [["일반", "normal"], ["네임드", "named"], ["특급", "exotic"]].forEach(([k, cls]) => {
        const b = el("button", "fkind fkind-" + cls, k);
        b.type = "button";
        b.setAttribute("aria-pressed", String(k === kindVal));
        b.addEventListener("click", () => {
          kindVal = k;
          kindWrap.querySelectorAll(".fkind").forEach((n) => n.setAttribute("aria-pressed", String(n.textContent === k)));
        });
        kindWrap.appendChild(b);
      });
    }
    form.appendChild(labeledField("등급", kindWrap));

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    if (editRow) nameInput.value = editRow.name;
    else if (createModelName) nameInput.value = createModelName;
    const nameLabel = createGroup === "무기" ? "무기명" : createGroup === "보호장구" ? "방어구명" : "아이템명";
    form.appendChild(labeledField(nameLabel, nameInput));

    // 무기와 방어구는 나무위키상 속성 체계 자체가 다르다.
    //   방어구/세트: 핵심속성 3종 중 1개(라디오) + 카테고리별(무기/방어도/스킬) 비핵심속성
    //   무기: 무기군별로 정해진 핵심속성 1~2개(다중 선택) + 공용 비핵심속성 13종(카테고리 구분 없음)
    const isWeaponGroup = createGroup === "무기";
    const modSlot = isWeaponGroup ? null
      : createGroup === "보호장구" ? ({ mask: "mask", chest: "chest", pack: "backpack" }[createCat] || null)
      : createGroup === "세트" ? (["mask", "chest", "backpack"].includes(createPieceSlot) ? createPieceSlot : null)
      : null;

    // 주속성
    const mainAttrsSelected = new Set(editRow && editRow.main_attrs ? editRow.main_attrs : []);
    const mainOptions = isWeaponGroup
      ? (weaponCoreAttrs[createCat] || []).map((n) => ({ label: n, color: "red" }))
      : gearCoreAttrs;
    const mainWrap = el("div", "fattr-row");
    const renderMainButtons = () => {
      mainWrap.replaceChildren();
      mainOptions.forEach((a) => {
        const b = el("button", "fattr-btn fattr-" + a.color, a.label);
        b.type = "button";
        b.setAttribute("aria-pressed", String(mainAttrsSelected.has(a.label)));
        b.addEventListener("click", () => {
          if (isWeaponGroup) {
            if (mainAttrsSelected.has(a.label)) mainAttrsSelected.delete(a.label); else mainAttrsSelected.add(a.label);
          } else {
            const already = mainAttrsSelected.has(a.label);
            mainAttrsSelected.clear();
            if (!already) mainAttrsSelected.add(a.label);
          }
          renderMainButtons();
        });
        mainWrap.appendChild(b);
      });
    };
    renderMainButtons();
    form.appendChild(labeledField("주속성", mainWrap));

    // 보조속성: 방어구/세트는 카테고리(무기/방어도/스킬) 탭 + 색상, 무기는 카테고리 구분 없는 단일 목록.
    // 네임드 방어구를 고른 경우의 고정 속성은 그대로 잠긴 태그로 위에 따로 보여준다.
    const allSecondary = isWeaponGroup ? weaponSecondaryAttrs.slice() : gearSecondaryGroups.flatMap((g) => g.items);
    const lockedSubAttrs = !editRow ? createFixedAttrs.slice() : [];
    const subAttrsSelected = new Set(
      editRow && editRow.sub_attrs ? editRow.sub_attrs.filter((v) => allSecondary.includes(v)) : []
    );
    const legacySubAttrs = editRow && editRow.sub_attrs
      ? editRow.sub_attrs.filter((v) => !allSecondary.includes(v))
      : [];

    const subBody = el("div", "");
    if (lockedSubAttrs.length || legacySubAttrs.length) {
      const lockedRow = el("div", "fattr-row");
      lockedSubAttrs.concat(legacySubAttrs).forEach((v) => lockedRow.appendChild(el("span", "ftag ftag-locked", v)));
      subBody.appendChild(lockedRow);
    }
    if (isWeaponGroup) {
      const itemRow = el("div", "fattr-row");
      weaponSecondaryAttrs.forEach((label) => {
        const b = el("button", "fattr-btn fattr-red", label);
        b.type = "button";
        b.setAttribute("aria-pressed", String(subAttrsSelected.has(label)));
        b.addEventListener("click", () => {
          if (subAttrsSelected.has(label)) subAttrsSelected.delete(label); else subAttrsSelected.add(label);
          b.setAttribute("aria-pressed", String(subAttrsSelected.has(label)));
        });
        itemRow.appendChild(b);
      });
      subBody.appendChild(itemRow);
    } else {
      let activeSubGroup = gearSecondaryGroups[0] ? gearSecondaryGroups[0].label : null;
      const subPicker = el("div", "");
      const renderSubPicker = () => {
        subPicker.replaceChildren();
        const tabRow = el("div", "fattr-row");
        gearSecondaryGroups.forEach((g) => {
          const b = el("button", "fattr-tab fattr-" + g.color, g.label);
          b.type = "button";
          b.setAttribute("aria-pressed", String(activeSubGroup === g.label));
          b.addEventListener("click", () => { activeSubGroup = g.label; renderSubPicker(); });
          tabRow.appendChild(b);
        });
        subPicker.appendChild(tabRow);
        const group = gearSecondaryGroups.find((g) => g.label === activeSubGroup);
        const itemRow = el("div", "fattr-row");
        (group ? group.items : []).forEach((label) => {
          const b = el("button", "fattr-btn fattr-" + group.color, label);
          b.type = "button";
          b.setAttribute("aria-pressed", String(subAttrsSelected.has(label)));
          b.addEventListener("click", () => {
            if (subAttrsSelected.has(label)) subAttrsSelected.delete(label); else subAttrsSelected.add(label);
            b.setAttribute("aria-pressed", String(subAttrsSelected.has(label)));
          });
          itemRow.appendChild(b);
        });
        subPicker.appendChild(itemRow);
      };
      renderSubPicker();
      subBody.appendChild(subPicker);
    }
    form.appendChild(labeledField("보조속성", subBody));

    // 개조: 마스크/방탄복/백팩(세트 포함)만 해당 — 전체 종류가 나무위키에 명확히 정리돼 있지
    // 않아 고정 목록 대신 자동완성이 붙은 자유 입력으로 처리한다.
    let modInput = null;
    if (modSlot) {
      modInput = document.createElement("input");
      modInput.type = "text";
      modInput.setAttribute("list", "mod-options");
      modInput.placeholder = "개조 부품 이름 (예: 정예 대상 방호도, 직접 입력 가능)";
      if (editRow) modInput.value = editRow.gear_mod || "";
      const modList = document.createElement("datalist");
      modList.id = "mod-options";
      gearModOptions.forEach((n) => {
        const opt = document.createElement("option");
        opt.value = n;
        modList.appendChild(opt);
      });
      form.appendChild(labeledField(`개조 (${SLOT_LABELS[modSlot] || modSlot})`, modInput));
      form.appendChild(modList);
    }

    const fxInput = document.createElement("input");
    fxInput.type = "text";
    fxInput.setAttribute("list", "fx-options");
    fxInput.placeholder = "이름으로 검색하거나 목록에서 선택 (직접 입력도 가능)";
    if (editRow) fxInput.value = editRow.special_effect || "";
    else if (createModelEffect) fxInput.value = createModelEffect;
    const fxOptions = talentOptions[createGroup === "세트" ? "보호장구" : createGroup] || [];
    const fxList = document.createElement("datalist");
    fxList.id = "fx-options";
    fxOptions.forEach((t) => {
      const opt = document.createElement("option");
      opt.value = t.name_ko;
      fxList.appendChild(opt);
    });
    fxInput.addEventListener("input", () => {
      const match = fxOptions.find((t) => t.name_ko === fxInput.value);
      if (match) fxInput.value = `${match.name_ko}: ${match.desc_ko}`;
    });
    form.appendChild(labeledField("특수효과", fxInput));
    form.appendChild(fxList);

    const shareRow = el("label", "fcreate-share");
    const shareInput = document.createElement("input");
    shareInput.type = "checkbox";
    if (editRow) shareInput.checked = !!editRow.shared;
    shareRow.appendChild(shareInput);
    shareRow.appendChild(document.createTextNode(" 친구들에게 공유하기"));
    form.appendChild(shareRow);

    const saveBtn = el("button", "refresh", editRow ? "수정 완료" : "저장");
    saveBtn.type = "submit";
    form.appendChild(saveBtn);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      const mainAttrs = [...mainAttrsSelected];
      const subAttrs = lockedSubAttrs.concat(legacySubAttrs, [...subAttrsSelected]);
      const savedCat = createCat;
      const payload = {
        kind: kindVal, name,
        mainAttrs, subAttrs, effect: fxInput.value.trim(), shared: shareInput.checked,
        gearMod: modInput ? modInput.value.trim() : null
      };
      if (buildReturnSlot && !editRow) {
        const created = await saveCustomItem({ category: savedCat, ...payload });
        if (!created) return;
        await loadCustomItems();
        buildDraft.slots[buildReturnSlot] = { itemId: created.id, name: created.name };
        buildReturnSlot = null;
        createGroup = "빌드";
        renderCreatePanel();
        return;
      }
      const ok = editRow
        ? await updateCustomItem(editRow.id, payload)
        : await saveCustomItem({ category: savedCat, ...payload });
      if (!ok) return;
      await loadCustomItems();
      farmCat = savedCat;
      closeCreatePanel();
      renderFarmChips();
    });

    box.appendChild(form);
  }

  function renderBuildEditor(box) {
    if (!buildDraft) buildDraft = { id: null, name: "", skill1: "", skill2: "", shared: false, slots: {} };

    box.appendChild(pickerHeader(() => { buildDraft = null; createGroup = null; renderCreatePanel(); }));

    const center = el("div", "fcreate-center");
    center.appendChild(el("div", "fcreate-intro", "빌드 구성"));

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = buildDraft.name;
    nameInput.addEventListener("input", () => { buildDraft.name = nameInput.value; });
    center.appendChild(labeledField("빌드명", nameInput));

    BUILD_SLOT_ROWS.forEach((keys) => {
      const row = el("div", "fcard-grid-build cols-" + keys.length);
      keys.forEach((key) => {
        const s = BUILD_SLOTS.find((x) => x.key === key);
        const filled = buildDraft.slots[s.key];
        const b = el("button", "fcard fcard-sm", filled ? `${s.label}: ${filled.name}` : s.label);
        b.type = "button";
        b.addEventListener("click", () => {
          buildReturnSlot = s.key;
          editingId = null;
          createModelName = undefined; createModelKind = null; createModelEffect = null; createFixedAttrs = []; createPieceSlot = null;
          if (s.type === "weapon") { createGroup = "무기"; createCat = null; }
          else { createGroup = "보호장구"; createCat = s.cat; }
          renderCreatePanel();
        });
        row.appendChild(b);
      });
      center.appendChild(row);
    });

    const skillRow = el("div", "fcard-grid-build cols-2");
    ["skill1", "skill2"].forEach((key, i) => {
      const label = i === 0 ? "스킬1" : "스킬2";
      const filled = buildDraft[key];
      const b = el("button", "fcard fcard-sm", filled ? `${label}: ${filled}` : label);
      b.type = "button";
      b.addEventListener("click", () => { buildSkillSlot = key; skillPickCategory = null; renderCreatePanel(); });
      skillRow.appendChild(b);
    });
    center.appendChild(skillRow);

    const shareRow = el("label", "fcreate-share");
    const shareInput = document.createElement("input");
    shareInput.type = "checkbox";
    shareInput.checked = buildDraft.shared;
    shareRow.appendChild(shareInput);
    shareRow.appendChild(document.createTextNode(" 친구들에게 공유하기"));
    center.appendChild(shareRow);

    const saveBtn = el("button", "refresh", buildDraft.id ? "수정 완료" : "빌드 저장");
    saveBtn.type = "button";
    saveBtn.addEventListener("click", async () => {
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      buildDraft.name = name;
      buildDraft.shared = shareInput.checked;
      const saved = await saveBuild(buildDraft);
      if (!saved) return;
      await loadCustomItems();
      await loadBuilds();
      buildDraft = null;
      farmCat = "build-" + saved.id;
      closeCreatePanel();
      renderFarmChips();
    });
    center.appendChild(saveBtn);

    box.appendChild(center);
  }

  function renderSkillPicker(box) {
    if (!skillPickCategory) {
      box.appendChild(pickerHeader(() => { buildSkillSlot = null; renderCreatePanel(); }));
      const center = el("div", "fcreate-center");
      center.appendChild(el("div", "fcreate-intro", "스킬 종류를 선택하세요"));
      const grid = el("div", "fcard-grid");
      Object.keys(skillOptions).forEach((catKo) => {
        const b = el("button", "fcard fcard-sm", catKo);
        b.type = "button";
        b.addEventListener("click", () => { skillPickCategory = catKo; renderCreatePanel(); });
        grid.appendChild(b);
      });
      if (!grid.children.length) grid.appendChild(el("span", "fcreate-empty", "스킬 목록을 불러오지 못했습니다."));
      center.appendChild(grid);
      box.appendChild(center);
      return;
    }

    box.appendChild(pickerHeader(() => { skillPickCategory = null; renderCreatePanel(); }));
    const center = el("div", "fcreate-center");
    center.appendChild(el("div", "fcreate-intro", `${skillPickCategory} 종류를 선택하세요`));
    const grid = el("div", "fcard-grid");
    (skillOptions[skillPickCategory] || []).forEach((name) => {
      const b = el("button", "fcard fcard-sm", name);
      b.type = "button";
      b.addEventListener("click", () => {
        buildDraft[buildSkillSlot] = name;
        buildSkillSlot = null;
        skillPickCategory = null;
        renderCreatePanel();
      });
      grid.appendChild(b);
    });
    center.appendChild(grid);
    box.appendChild(center);
  }

  function setView(v) {
    const farmOn = v === "farm";
    closeSheet();
    $("view-loot").hidden = farmOn;
    $("view-farm").hidden = !farmOn;
    $("tab-loot").setAttribute("aria-selected", String(!farmOn));
    $("tab-farm").setAttribute("aria-selected", String(farmOn));
    $("refresh").hidden = farmOn;
    document.querySelector("h1").textContent = farmOn ? "파밍 체크리스트" : "확전 타겟 루트";
    if (farmOn) renderFarmChips();
  }

  if (session) {
    $("tabs").hidden = false;
    await loadFarmDone();
    await loadCustomItems();
    await loadTalentOptions();
    await loadWeaponModels();
    await loadWeaponNamed();
    await loadWeaponExotic();
    await loadGearNamed();
    await loadGearExotic();
    await loadSetPieces();
    await loadBuilds();
    await loadSkills();
    await loadAttrCatalogs();
    buildSearchIndex();
    $("tab-loot").addEventListener("click", () => setView("loot"));
    $("tab-farm").addEventListener("click", () => setView("farm"));
    $("farm-create-btn").addEventListener("click", () => {
      if (createOpen) { closeCreatePanel(); return; }
      createOpen = true;
      renderCreatePanel();
    });
  }

  // ---------- 불러오기 ----------
  async function load() {
    if (loading) return;
    loading = true;
    clearTimeout(pollTimer);
    const btn = $("refresh");
    btn.disabled = true;
    btn.textContent = "불러오는 중…";

    try {
      const res = await fetch(JSON_URL, { cache: "no-cache" });
      if (!res.ok) throw new Error(`서버가 HTTP ${res.status}로 응답했습니다.`);
      const data = await res.json();
      const fresh = collectDays(data);

      const keepDay = selected >= 0 && days[selected] ? days[selected].day : null;
      const wasLatest = selected < 0 || selected === days.length - 1;
      days = fresh;
      const keepIdx = keepDay ? days.findIndex((d) => d.day === keepDay) : -1;
      selected = wasLatest || keepIdx < 0 ? days.length - 1 : keepIdx;
      checkedAt = new Date();

      const sig = JSON.stringify(days[days.length - 1].row);
      const changed = sig !== lastSig;
      lastSig = sig;

      $("error").hidden = true;
      renderStatus();
      renderDays();
      renderSelected(changed);
    } catch (err) {
      const box = $("error");
      box.hidden = false;
      box.textContent = `데이터를 불러오지 못했습니다. ${err.message} 인터넷 연결을 확인하거나, 원본 주소가 바뀌었는지 확인하세요.` +
        (days.length ? " 이전에 불러온 데이터를 계속 보여 줍니다." : "");
      if (!days.length) {
        $("verdict").dataset.state = "bad";
        $("verdict").textContent = "아직 불러온 데이터가 없습니다.";
      }
    } finally {
      loading = false;
      btn.disabled = false;
      btn.textContent = "새로고침";
      renderTimes();
      const latest = days.length ? days[days.length - 1].day : null;
      const waiting = !latest || latest < gameDayOf(new Date());
      pollTimer = setTimeout(load, waiting ? POLL_WAITING_MS : POLL_IDLE_MS);
    }
  }

  // ---------- 시작 ----------
  $("refresh").addEventListener("click", load);

  setInterval(() => {
    if (Date.now() >= resetAt) {
      resetAt = nextResetAfter(new Date());
      load();
    }
    renderTimes();
  }, 1000);

  renderTimes();
  load();
})();
</script>
